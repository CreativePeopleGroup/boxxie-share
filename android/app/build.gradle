plugins {
    id 'com.android.application'
}

def appUrl = (project.findProperty('appUrl') ?: 'https://example.github.io/boxxie-share/').toString()
if (!appUrl.endsWith('/')) appUrl = appUrl + '/'
def versionNum = (project.findProperty('versionCode') ?: '1').toString().toInteger()
def versionLabel = (project.findProperty('versionName') ?: '1.0.0').toString()

android {
    namespace 'com.boxxieshare.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.boxxieshare.app'
        minSdk 22          // Fire TV Stick (2nd gen, Fire OS 5) and newer
        targetSdk 36
        versionCode versionNum
        versionName versionLabel
        // Where the update button looks: the latest GitHub release (set by the build workflow)
        buildConfigField 'String', 'UPDATE_URL', '"' + (project.findProperty('updateUrl') ?: '') + '"'
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
        buildConfigField 'String', 'SERVER_URL', '"' + (project.findProperty('serverUrl') ?: 'https://boxxie-share-server.ricky-kundi.workers.dev') + '"'
        // Fire TV, Android TV boxes and phones are ARM. Leaving out x86 keeps the app small.
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    buildFeatures {
        buildConfig true
    }

    // Two versions of the same app:
    //  play   - for the Google Play Store: no "read all videos" permission; films come from
    //           Android's own file picker (Google's photo and video permissions policy).
    //  direct - for Fire TV / Downloader / Amazon Appstore: also lists the films on the device,
    //           because most Fire TVs have no file picker.
    flavorDimensions 'store'
    productFlavors {
        play {
            dimension 'store'
            buildConfigField 'boolean', 'LIST_DEVICE_VIDEOS', 'false'
            buildConfigField 'boolean', 'SELF_UPDATE', 'false' // Google Play updates the app
        }
        direct {
            dimension 'store'
            buildConfigField 'boolean', 'LIST_DEVICE_VIDEOS', 'true'
            buildConfigField 'boolean', 'SELF_UPDATE', 'true'  // Update button in the app
        }
    }

    signingConfigs {
        release {
            // Supplied by the GitHub workflow from repository secrets (see README).
            def ks = System.getenv('BOXXIE_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('BOXXIE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BOXXIE_KEY_ALIAS')
                keyPassword System.getenv('BOXXIE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('BOXXIE_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            } else {
                // No release key set up yet: sign with the debug key so it still installs.
                signingConfig signingConfigs.debug
            }
        }
    }

    lint {
        // Lint can't see every Build.VERSION guard; don't let warnings block a build.
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        // Native libraries stay uncompressed and 16 KB aligned (needed for Android 15+ and Fire OS 16)
        jniLibs { useLegacyPackaging false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.all { task ->
            task.systemProperty 'boxxie.manifest', project.file('src/main/AndroidManifest.xml').absolutePath
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.5.1'
    testImplementation 'org.json:json:20250517'
    // Google's open-source WebRTC engine (prebuilt by the webrtc-sdk project): the video engine
    // that sends the whole screen to friends while the app is in the background.
    implementation 'io.github.webrtc-sdk:android:144.7559.15'
}

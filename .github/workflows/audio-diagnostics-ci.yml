name: Android audio test CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/audio-diagnostics-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Android audio fix APK (not a release)
        run: |
          gradle -p android assembleDirectRelease testDirectDebugUnitTest \
            -PappUrl="https://creativepeoplegroup.github.io/boxxie-share/" \
            -PversionCode=1017 -PversionName=1.0.16-audio-fix \
            -PupdateUrl="https://github.com/CreativePeopleGroup/boxxie-share/releases/latest/download/"
      - name: Upload isolated test APK
        uses: actions/upload-artifact@v4
        with:
          name: BoxxieShare-audio-fix-test
          path: android/app/build/outputs/apk/direct/release/app-direct-release.apk
          retention-days: 7

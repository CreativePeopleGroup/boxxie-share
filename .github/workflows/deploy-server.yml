name: Deploy server

# Tests and deploys the connection server to Cloudflare Workers (free plan).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (README step 2).
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/deploy-server.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run server tests
        working-directory: server
        run: node --import ./test/register.mjs test/harness.mjs

      - name: Work out which website may use the server
        id: origin
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          ORIGIN="${{ vars.PAGES_ORIGIN }}"
          if [ -z "$ORIGIN" ]; then ORIGIN="https://${OWNER}.github.io"; fi
          echo "Allowed website: $ORIGIN"
          echo "value=$ORIGIN" >> "$GITHUB_OUTPUT"

      - name: Check the Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Never prints the token: only whether Cloudflare accepts it.
          if [ -z "$CF_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is empty or missing"; exit 1; fi
          if [ -z "$CF_ACCOUNT" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID secret is empty or missing"; exit 1; fi
          LEN=${#CF_TOKEN}; TRIM="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"
          [ "$TRIM" != "$CF_TOKEN" ] && echo "::warning::CLOUDFLARE_API_TOKEN has spaces or line breaks in it"
          R="$(curl -s -H "Authorization: Bearer $TRIM" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          OK="$(echo "$R" | jq -r '.success')"; ST="$(echo "$R" | jq -r '.result.status // "none"')"; ER="$(echo "$R" | jq -c '.errors')"
          echo "::notice::Token length $LEN, accepted=$OK, status=$ST, errors=$ER"
          A="$(curl -s -H "Authorization: Bearer $TRIM" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT" | jq -c '{success, errors}')"
          echo "::notice::Account check: $A"
          [ "$OK" = "true" ] || exit 1

      - name: Deploy to Cloudflare
        id: deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORIGIN: ${{ steps.origin.outputs.value }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          set -o pipefail
          # Pasted secrets often carry a stray space or line break: strip them.
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (README step 2)."
            exit 1
          fi
          EXTRA=""
          if [ -n "$CONTACT_EMAIL" ]; then EXTRA="--var CONTACT_EMAIL:$CONTACT_EMAIL"; fi
          # CONTACT_EMAIL (repository variable) also receives abuse reports, unless REPORT_EMAIL is set.
          if ! npx --yes wrangler@4 deploy --var "ALLOWED_ORIGINS:$ORIGIN" $EXTRA 2>&1 | tee deploy.log; then
            # Show the reason on the run page, not only in the raw log.
            sed 's/\x1b\[[0-9;]*m//g' deploy.log | grep -v '^\s*$' | grep -A8 -E "ERROR|✘" | head -40 | sed 's/^/::error::/'
            exit 1
          fi
          URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Server address: $URL"

      # Optional settings: add any of these as GitHub repository secrets and they're passed to the
      # server on every deploy. BREVO_API_KEY + EMAIL_FROM switch on email sign-in codes.
      - name: Send settings to the server
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S_EMAIL_API_KEY: ${{ secrets.BREVO_API_KEY }}
          S_EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          S_ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          S_REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          S_REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          S_REVIEW_CODE: ${{ secrets.REVIEW_CODE }}
          S_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          S_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          S_FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          S_FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          S_TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          S_TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
        run: |
          if [ -n "$S_EMAIL_API_KEY" ]; then export S_EMAIL_PROVIDER=brevo; fi
          set_count=0
          for n in EMAIL_PROVIDER EMAIL_API_KEY EMAIL_FROM ADMIN_TOKEN REPORT_EMAIL REVIEW_EMAIL REVIEW_CODE GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET FACEBOOK_APP_ID FACEBOOK_APP_SECRET TURN_KEY_ID TURN_KEY_API_TOKEN; do
            v="$(printenv "S_$n" || true)"
            [ -z "$v" ] && continue
            printf '%s' "$v" | npx --yes wrangler@4 secret put "$n" > /dev/null
            echo "Set $n"; set_count=$((set_count+1))
          done
          echo "::notice::Server settings sent: $set_count"

      - name: Show the server address
        run: |
          echo "### Server deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Address: \`${{ steps.deploy.outputs.deployment-url }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Add it as the **SERVER_URL** repository variable (README step 3), then re-run **Deploy web app**." >> "$GITHUB_STEP_SUMMARY"

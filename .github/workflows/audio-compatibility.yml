name: Audio browser compatibility
on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'server/**'
      - '.github/workflows/audio-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server regression checks
        working-directory: server
        run: node --import ./test/register.mjs test/harness.mjs
      - name: Install browser test runtime
        working-directory: server
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          if [ "${{ matrix.browser }}" = "chromium" ]; then
            # The runner already includes Chrome and its system libraries. Avoid
            # slow Ubuntu mirror downloads for optional Chromium font packages.
            chrome_path="$(command -v google-chrome)"
            test -x "$chrome_path"
            google-chrome --version
            echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          else
            # Some hosted runners select a severely throttled Azure package
            # mirror. Keep the same signed Ubuntu packages on the official mirror.
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
            fi
            npx playwright install --with-deps chromium ${{ matrix.browser }}
          fi
      - name: Test received audio, playback refusal and sharing restart
        timeout-minutes: 5
        working-directory: server
        env:
          BOXXIE_BROWSER: ${{ matrix.browser }}
        run: |
          node --import ./test/register.mjs test/devserver.mjs 8788 > /tmp/boxxie-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8788/health; then break; fi
            sleep 1
          done
          node test/e2e_audio.cjs
      - name: Save TV and phone layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BoxxieShare-layout-${{ matrix.browser }}
          path: /tmp/boxxie-ui-*.png
          if-no-files-found: ignore

name: Build Android app

# Builds the Fire TV / Android TV / Android phone app and publishes it as a GitHub Release,
# so this link always points at the newest version:
#   https://github.com/<you>/<repo>/releases/latest/download/BoxxieShare.apk
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish as latest release after signing verification'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Work out the web app address
        id: url
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="${{ github.event.repository.name }}"
          URL="${{ vars.APP_URL }}"
          if [ -z "$URL" ]; then URL="https://${OWNER}.github.io/${REPO}/"; fi
          echo "App will open: $URL"
          echo "value=$URL" >> "$GITHUB_OUTPUT"

      - name: Set up stable release signing key
        env:
          KEYSTORE_B64: ${{ secrets.BOXXIE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "BOXXIE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with your release key."
          else
            echo "::error::A stable release signing key is required for in-place updates."
            exit 1
          fi

      - name: Build
        env:
          # Only BOXXIE_KEYSTORE_BASE64 is needed: the key file itself is the secret.
          # (The other three can still be set to override these defaults.)
          BOXXIE_KEYSTORE_PASSWORD: ${{ secrets.BOXXIE_KEYSTORE_PASSWORD || 'boxxie-share-signing' }}
          BOXXIE_KEY_ALIAS: ${{ secrets.BOXXIE_KEY_ALIAS || 'boxxie' }}
          BOXXIE_KEY_PASSWORD: ${{ secrets.BOXXIE_KEY_PASSWORD || 'boxxie-share-signing' }}
        run: |
          # direct = Fire TV / Downloader / Amazon Appstore (APK)
          # play   = Google Play Store (App Bundle, no "read all videos" permission)
          set -o pipefail
          if ! gradle -p android assembleDirectRelease bundlePlayRelease \
            -PappUrl="${{ steps.url.outputs.value }}" \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }} \
            -PupdateUrl="https://github.com/${{ github.repository }}/releases/latest/download/" 2>&1 | tee build.log; then
            # Show the reason on the run page (and to anyone helping), not only in the raw log.
            { grep -E "^e: |error:|ERROR:" build.log | head -15
              awk '/What went wrong/{f=1} /^\* Try:/{f=0} f' build.log | head -25; } | sed 's/^/::error::/'
            exit 1
          fi
          cp android/app/build/outputs/apk/direct/release/app-direct-release.apk BoxxieShare.apk
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab BoxxieShare-GooglePlay.aab
          # The app's Update button reads this to see if there's a newer version
          echo '{"versionCode": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}"}' > version.json
          if [ -z "$BOXXIE_KEYSTORE_PATH" ]; then
            echo "::warning::BoxxieShare-GooglePlay.aab is signed with a temporary key, so Google Play will refuse it. Add your upload key (README: Google Play) and run this again."
          fi

      - name: Verify signing certificate matches the current installed release
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/${{ github.repository }}/releases/latest/download/BoxxieShare.apk" \
            --output "$RUNNER_TEMP/previous-BoxxieShare.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$signer"
          previous_cert="$("$signer" verify --print-certs "$RUNNER_TEMP/previous-BoxxieShare.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          candidate_cert="$("$signer" verify --print-certs BoxxieShare.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test -n "$previous_cert"
          {
            echo "Previous release certificate SHA-256: $previous_cert"
            echo "Candidate certificate SHA-256: $candidate_cert"
          } | tee signing-verification.txt
          if [ "$previous_cert" != "$candidate_cert" ]; then
            echo "::error::Signing certificates differ. Do not publish this APK as an in-place update."
            exit 1
          fi
          previous_version="$(curl --fail --silent --location --retry 3 \
            "https://github.com/${{ github.repository }}/releases/latest/download/version.json" | jq -r .versionCode)"
          candidate_version="$(jq -r .versionCode version.json)"
          if ! [ "$candidate_version" -gt "$previous_version" ]; then
            echo "::error::The update version must be higher than the current release."
            exit 1
          fi
          echo "Signing certificate matches: Android can accept this as an update to the current release."

      - uses: actions/upload-artifact@v4
        with:
          name: BoxxieShare-apk
          path: |
            BoxxieShare.apk
            version.json
            signing-verification.txt

      # Download this from the run's page and upload it in Google Play Console.
      - uses: actions/upload-artifact@v4
        with:
          name: BoxxieShare-GooglePlay-aab
          path: BoxxieShare-GooglePlay.aab

      - name: Publish release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-1.0.${{ github.run_number }}
          name: Boxxie Share 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            BoxxieShare.apk
            version.json
          body: |
            Install on Fire TV / Android TV with the Downloader app using:
            https://github.com/${{ github.repository }}/releases/latest/download/BoxxieShare.apk
